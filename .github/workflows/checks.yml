name: Frontend checks

on:
  push:
  pull_request:
  workflow_dispatch:

# Les vérifications ont seulement besoin de lire les sources du dépôt.
permissions:
  contents: read

# Un nouveau commit remplace les vérifications en cours pour la même branche ou PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, types and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # Les SHA fixent les versions vérifiées des actions, même si leurs tags évoluent.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # La version de pnpm est lue dans package.json, avant de préparer son cache.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Le verrou doit correspondre au manifeste ; la CI ne le corrige pas automatiquement.
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Même commande qu’en local : tests, vérification TypeScript et construction Vite.
      - name: Run frontend checks
        run: pnpm check
